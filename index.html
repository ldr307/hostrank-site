<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All pages</title>
  <meta name="description" content="Every page published on this site, grouped by section." />
  <link rel="canonical" href="https://hosts.fasthosting.info/" />
  <meta name="theme-color" content="#0b1220" />
  <style>:root{color-scheme:dark;--bg:#0b1220;--card:#111a2e;--line:#1f2a40;--ink:#f1f5f9;--text:#cbd5e1;--muted:#94a3b8;--link:#93c5fd}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.7}
    a{color:var(--link);text-underline-offset:3px}.bar{position:sticky;top:0;background:rgba(11,18,32,.92);border-bottom:1px solid var(--line);padding:12px 16px}.bar a{color:var(--ink);font-weight:700;text-decoration:none}
    main{max-width:760px;margin:0 auto;padding:24px 16px 56px}h1{color:var(--ink);font-size:1.7rem;line-height:1.3;margin:.4rem 0}h2{color:var(--ink);font-size:1.15rem;margin:2rem 0 .6rem}
    .crumbs ol{list-style:none;display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:0;font-size:.85rem;color:var(--muted)}.crumbs li+li::before{content:"›";margin-right:6px}
    .lead{color:var(--muted)}ul.hub{list-style:none;padding:0;margin:0;display:grid;gap:10px}ul.hub li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
    ul.hub a{font-weight:600}ul.hub p{margin:.2rem 0 0;font-size:.9rem;color:var(--muted)}footer{border-top:1px solid var(--line);padding:16px;text-align:center;font-size:.85rem}</style>
</head>
<body>
  <header class="bar"><a href="./">⌂ Home</a></header>
  <main>
    
    <h1>All pages</h1>
    <p class="lead">Every page published on this site, grouped by section.</p>
    <ul class="hub">
      <li><a href="hosts/">Hosting plans</a><p>10 pages</p></li>
      <li><a href="compare/">Hosting comparisons</a><p>1 page</p></li>
    </ul>
  </main>
  <footer><a href="./">⌂ Home</a></footer>
</body>
</html>
